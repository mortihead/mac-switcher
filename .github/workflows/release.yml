name: Release

# Релиз собирается, когда в репозиторий пушится тег вида v1.2.0:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      - name: Build universal app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/MacSwitcher.app "build/MacSwitcher-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/MacSwitcher-${GITHUB_REF_NAME}.zip" --title "MacSwitcher ${GITHUB_REF_NAME}" --generate-notes
